apiVersion: apps/v1
kind: Deployment
metadata:
  name: gophprofile-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gophprofile-server
  template:
    metadata:
      labels:
        app: gophprofile-server
    spec:
      containers:
        - name: server
          image: gophprofile:latest
          command: ["./server"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gophprofile
            - secretRef:
                name: gophprofile-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gophprofile-server
spec:
  selector:
    app: gophprofile-server
  ports:
    - port: 8080
      targetPort: 8080
