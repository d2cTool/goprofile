global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gophprofile-server
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8080"]
        labels:
          service: gophprofile-server
  - job_name: gophprofile-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]
        labels:
          service: gophprofile-worker
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
