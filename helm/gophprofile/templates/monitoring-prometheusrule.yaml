{{- if and .Values.monitoring.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "gophprofile.fullname" . }}-avatar-service
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  groups:
    - name: avatar-service
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(avatars_uploads_total{status="error"}[5m]))
              /
              clamp_min(sum(rate(avatars_uploads_total[5m])), 0.001)
            ) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High avatar upload error rate
            description: More than 10% of uploads failed for 5 minutes.

        - alert: HighResponseTime
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(avatars_upload_duration_seconds_bucket[5m])) by (le)
            ) > 5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Avatar upload p95 is above 5s
            description: Upload latency p95 exceeded 5 seconds for 2 minutes.

        - alert: HighHTTPErrorRate
          expr: |
            (
              sum(rate(http_requests_total{status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_requests_total[5m])), 0.001)
            ) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High HTTP 5xx rate
            description: More than 10% of HTTP requests return 5xx.

        - alert: HighHTTPResponseTime
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
            ) > 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: HTTP p95 is above 2s
            description: HTTP request p95 exceeded 2 seconds for 2 minutes.

        - alert: GophProfileServerDown
          expr: up{job=~".*gophprofile-server.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: GophProfile server target down
            description: Prometheus has not been able to scrape the server for 2 minutes.

        - alert: GophProfileWorkerDown
          expr: up{job=~".*gophprofile-worker.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: GophProfile worker target down
            description: Prometheus has not been able to scrape the worker for 2 minutes.
{{- end }}
