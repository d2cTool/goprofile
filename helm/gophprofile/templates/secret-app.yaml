{{- if not .Values.secrets.existingSecret }}
{{- $fullname := include "gophprofile.fullname" . }}
{{- $secretName := printf "%s-app" $fullname }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $postgresPassword := .Values.secrets.postgresPassword }}
{{- if not $postgresPassword }}
  {{- if $existing }}
    {{- $postgresPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
  {{- else }}
    {{- $postgresPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- $s3SecretKey := .Values.secrets.s3SecretKey }}
{{- if not $s3SecretKey }}
  {{- if $existing }}
    {{- $s3SecretKey = index $existing.data "S3_SECRET_KEY" | b64dec }}
  {{- else }}
    {{- $s3SecretKey = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
  annotations:
    # Password generation is idempotent across `helm upgrade` (reused via
    # `lookup`), but Helm still diffs this Secret every render; keep-secret
    # avoids it being deleted from history clutter on `helm uninstall --keep-history`.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.secrets.postgresUser $postgresPassword (include "gophprofile.postgresHost" .) .Values.secrets.postgresDb | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ $s3SecretKey | quote }}
{{- end }}
