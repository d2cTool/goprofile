{{- $component := "otel-collector" }}
{{- if .Values.otelCollector.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gophprofile.componentName" (dict "context" . "component" $component) }}
  labels:
    {{- include "gophprofile.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gophprofile.componentSelectorLabels" (dict "context" . "component" $component) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.componentSelectorLabels" (dict "context" . "component" "server") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "gophprofile.componentSelectorLabels" (dict "context" . "component" "worker") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.componentSelectorLabels" (dict "context" . "component" "jaeger") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - podSelector:
            matchLabels:
              {{- include "gophprofile.componentSelectorLabels" (dict "context" . "component" "loki") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3100
{{- end }}
