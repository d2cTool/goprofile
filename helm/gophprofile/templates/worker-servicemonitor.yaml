{{- $component := "worker" }}
{{- if and .Values.worker.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gophprofile.componentName" (dict "context" . "component" $component) }}
  labels:
    {{- include "gophprofile.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gophprofile.componentSelectorLabels" (dict "context" . "component" $component) | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.worker.serviceMonitor.path }}
      interval: {{ .Values.worker.serviceMonitor.interval }}
{{- end }}
