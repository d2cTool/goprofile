apiVersion: v1
kind: Pod
metadata:
  name: {{ include "gophprofile.fullname" . }}-test-health
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command:
        - sh
        - -c
        - |
          set -e
          url="http://{{ include "gophprofile.componentName" (dict "context" . "component" "server") }}:{{ .Values.server.service.port }}/health"
          echo "GET $url"
          out=$(curl -sf "$url")
          echo "$out"
          echo "$out" | grep -q '"status":"ok"'
