{{- if and .Values.monitoring.grafanaDashboards.enabled .Values.kubePrometheusStack.enabled .Values.kubePrometheusStack.grafana.sidecar.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophprofile.fullname" . }}-grafana-dashboards
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    {{ .Values.kubePrometheusStack.grafana.sidecar.dashboards.label }}: {{ .Values.kubePrometheusStack.grafana.sidecar.dashboards.labelValue | quote }}
data:
  gophprofile.json: |-
{{ .Files.Get "dashboards/gophprofile.json" | indent 4 }}
  node-exporter.json: |-
{{ .Files.Get "dashboards/node-exporter.json" | indent 4 }}
{{- end }}
